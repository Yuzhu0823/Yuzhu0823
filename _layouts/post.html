---
layout: default
---
<article>
  <header class="post-header">
    <span class="post-date">{{ page.date | date: "%B %-d, %Y" }}</span>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-nav">
    <a href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a>
  </nav>
</article>
